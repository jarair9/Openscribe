appId: studio.openscribe.app
productName: Openscribe
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: open-assets
    to: open-assets
  # Window, taskbar and installer imagery, bundled at a sane size rather than
  # the 1.3 MB design source.
  - from: src/assets/openscribe-256.png
    to: openscribe-256.png
  # Video export needs an encoder on every machine, not only on the ones that
  # happen to have ffmpeg installed.
  - from: resources/ffmpeg/ffmpeg.exe
    to: ffmpeg/ffmpeg.exe
  - from: resources/ffmpeg/FFMPEG-LICENSE.txt
    to: ffmpeg/FFMPEG-LICENSE.txt
win:
  icon: build/icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
