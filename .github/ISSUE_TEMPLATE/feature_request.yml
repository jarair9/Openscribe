name: Feature request
description: An idea for the app
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What are you trying to do in your whiteboard videos that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from the user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you thought about solving the same problem.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples from VideoScribe, Doodly, or other tools are welcome.
