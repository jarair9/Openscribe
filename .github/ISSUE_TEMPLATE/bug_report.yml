name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Steps to make it happen again.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots / screen recording
      description: Drag images or clips in — extremely helpful for a visual editor.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Openscribe version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Project files (if shareable), log excerpts (Menu → open logs folder), anything else.
