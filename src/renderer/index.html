<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ows-asset: ows-library:; media-src 'self' data: blob: ows-asset: ows-library:; connect-src 'self' ows-asset: ows-library: ws://localhost:* http://localhost:*; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/openscribe-128.png" />
    <title>Openscribe</title>
    <style>
      /* Boot splash. Painted by the document itself so the window has something
         to show before the bundle has parsed, mounted, and read the project
         store. React removes it once the first frame is on screen. */
      html,
      body {
        margin: 0;
        background: #0a0a0b;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 9000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(760px 420px at 50% 26%, rgba(255, 63, 208, 0.09), transparent 62%),
          radial-gradient(900px 560px at 50% 108%, rgba(255, 255, 255, 0.035), transparent 62%),
          #0a0a0b;
        color: #f1f1f2;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        transition: opacity 280ms ease, visibility 280ms ease;
      }

      #boot::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 24px 24px;
        -webkit-mask-image: radial-gradient(closest-side, rgba(0, 0, 0, 0.8), transparent 78%);
        mask-image: radial-gradient(closest-side, rgba(0, 0, 0, 0.8), transparent 78%);
      }

      body.booted #boot {
        opacity: 0;
        visibility: hidden;
      }

      .boot-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: boot-rise 520ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      .boot-logo {
        width: 58px;
        height: 58px;
        border-radius: 14px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12),
          0 18px 44px rgba(0, 0, 0, 0.55);
      }

      .boot-brand {
        margin-top: 14px;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -0.4px;
      }

      .boot-sub {
        margin-top: 3px;
        font-size: 10px;
        font-weight: 550;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #6c6c74;
      }

      /* A real, indeterminate progress bar: a rounded track with a gradient
         sweep that keeps moving while the app is genuinely loading. */
      .boot-track {
        position: relative;
        width: 208px;
        height: 5px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .boot-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, #e21caf, #ff3fd0);
        animation: boot-sweep 1.35s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .boot-stage {
        min-height: 16px;
        margin-top: 12px;
        font-size: 11px;
        letter-spacing: 0.15px;
        color: #8a8a90;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-card {
          animation: none;
        }

        .boot-bar {
          animation: none;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <img class="boot-logo" src="../assets/openscribe-128.png" alt="" />
        <div class="boot-brand">Openscribe</div>
        <div class="boot-sub">Whiteboard animation studio</div>
        <div class="boot-track" aria-hidden="true">
          <div class="boot-bar"></div>
        </div>
        <div class="boot-stage" id="boot-stage">Preparing your workspace</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
