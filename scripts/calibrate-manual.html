<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hand Tip Calibrator</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1f232b;
    --line: #2c313c;
    --text: #e7eaf0;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-2: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); }
  #progress { font-variant-numeric: tabular-nums; }
  #guidance {
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    color: #d6e2ff;
    font-size: 13px;
  }
  #guidance b { color: #fff; }
  #viewport {
    flex: 1;
    overflow: auto;
    position: relative;
    background:
      linear-gradient(45deg, #1b1e24 25%, transparent 25%, transparent 75%, #1b1e24 75%),
      linear-gradient(45deg, #1b1e24 25%, transparent 25%, transparent 75%, #1b1e24 75%);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
    background-color: #23272f;
    padding: 24px;
  }
  #stage {
    position: relative;
    display: inline-block;
    line-height: 0;
    box-shadow: 0 0 0 1px var(--line), 0 8px 30px rgba(0,0,0,.5);
    background: #fff;
    cursor: crosshair;
  }
  #stage img { display: block; }
  .marker {
    position: absolute;
    width: 22px; height: 22px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 5;
  }
  .marker::before, .marker::after {
    content: '';
    position: absolute;
    background: currentColor;
  }
  .marker::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
  .marker::after { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
  .marker .dot {
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: currentColor;
  }
  #manualMarker { color: var(--danger); }
  #shippedMarker { color: var(--accent); }
  footer {
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
    font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: #ffb4b4; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #readout { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  #readout .ok { color: var(--accent-2); }
  kbd {
    background: #2a2f3a;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
    font-family: inherit;
  }
  #done {
    display: none;
    max-width: 560px;
    margin: 60px auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
    text-align: center;
  }
  #done h2 { margin-top: 0; }
  .hint { color: var(--muted); font-size: 12px; }
  input[type=number] {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    width: 90px;
    font: inherit;
  }
</style>
</head>
<body>
  <header>
    <h1>Hand Tip Calibrator</h1>
    <span class="meta" id="progress"></span>
    <span class="meta" id="doneCount"></span>
    <span class="meta" id="name"></span>
  </header>

  <div id="guidance"></div>

  <div id="viewport">
    <div id="stage">
      <img id="img" alt="hand" />
      <div class="marker" id="shippedMarker" style="display:none"><div class="dot"></div></div>
      <div class="marker" id="manualMarker" style="display:none"><div class="dot"></div></div>
    </div>
    <div id="done">
      <h2>All poses calibrated</h2>
      <p id="doneSummary"></p>
      <p class="hint">Results are saved to <code>tools/manual-tips.json</code>.</p>
      <p class="hint">Apply them with <code>node scripts/apply-manual-tips.mjs</code>, then restart the app to test.</p>
      <button onclick="goTo(0)">Review from the start</button>
    </div>
  </div>

  <footer>
    <button id="undo" onclick="undo()">&#8592; Undo</button>
    <button id="clear" class="danger" onclick="clearPoint()">Clear</button>
    <button id="skip" onclick="skip()">Skip</button>
    <button id="next" class="primary" onclick="next()">Next &#8594;</button>
    <label class="hint">Go to <input type="number" id="jump" min="1" /> </label>
    <span id="readout"></span>
  </footer>

<script>
  const $ = (id) => document.getElementById(id)
  let items = []
  let shipped = {}
  let manual = {}
  let index = 0
  let zoom = 1
  let current = null // [x, y] normalized, or null

  const GUIDANCE = {
    tool: 'Click the <b>exact pixel where the instrument touches the paper</b>: the ball of a ballpoint, the nib of a fountain pen, the point of a pencil, or the leading tip of a marker / highlighter / crayon / chalk. Aim for the single point of contact with the stroke.',
    brush: 'Click the <b>centre of the bristle tips</b> — the working end of the brush that paints, not the wooden handle.',
    eraser: 'Click the <b>centre of the eraser\'s working edge</b> — the edge of the block or wedge that rubs the board clean.',
    gesture: 'Click the <b>tip of the pointing finger</b> (or thumb) — the part that touches, points or drags.'
  }

  function clamp01(v) { return Math.min(1, Math.max(0, v)) }

  function pointFor(item) {
    const rec = manual[item.id]
    if (!rec) return null
    const p = item.pose === 1 ? rec.tip : rec.tip2
    return Array.isArray(p) ? [p[0], p[1]] : null
  }
  function setPoint(item, p) {
    manual[item.id] ??= {}
    if (item.pose === 1) manual[item.id].tip = [p[0], p[1]]
    else manual[item.id].tip2 = [p[0], p[1]]
  }
  function clearPoint() {
    const item = items[index]
    if (!item) return
    const rec = manual[item.id]
    if (rec) {
      if (item.pose === 1) delete rec.tip
      else delete rec.tip2
      if (!rec.tip && !rec.tip2) delete manual[item.id]
    }
    current = null
    placeMarkers()
    updateReadout()
    save()
  }
  function isSet(item) {
    const rec = manual[item.id]
    if (!rec) return false
    return item.pose === 1 ? Array.isArray(rec.tip) : Array.isArray(rec.tip2)
  }

  function applySize() {
    const img = $('img')
    img.style.width = `${img.naturalWidth * zoom}px`
    const stage = $('stage')
    stage.style.width = `${img.naturalWidth * zoom}px`
    stage.style.height = `${img.naturalHeight * zoom}px`
  }

  function placeMarkers() {
    const item = items[index]
    const manualEl = $('manualMarker')
    const shippedEl = $('shippedMarker')
    const sp = shipped[item?.id]
    const spPoint = item && sp ? (item.pose === 1 ? sp.tip : sp.tip2) : null
    if (spPoint) {
      shippedEl.style.display = 'block'
      shippedEl.style.left = `${clamp01(spPoint[0]) * 100}%`
      shippedEl.style.top = `${clamp01(spPoint[1]) * 100}%`
    } else {
      shippedEl.style.display = 'none'
    }
    if (current) {
      manualEl.style.display = 'block'
      manualEl.style.left = `${clamp01(current[0]) * 100}%`
      manualEl.style.top = `${clamp01(current[1]) * 100}%`
    } else {
      manualEl.style.display = 'none'
    }
  }

  function updateReadout() {
    const item = items[index]
    const el = $('readout')
    if (!item) { el.textContent = ''; return }
    if (current) {
      const img = $('img')
      const px = Math.round(current[0] * img.naturalWidth)
      const py = Math.round(current[1] * img.naturalHeight)
      el.innerHTML = `<span class="ok">set</span> ${current[0].toFixed(4)}, ${current[1].toFixed(4)} &middot; px ${px}, ${py}`
    } else {
      el.textContent = 'not set'
    }
  }

  function updateCounts() {
    let set = 0
    for (const item of items) if (isSet(item)) set += 1
    $('doneCount').textContent = `${set} / ${items.length} set`
  }

  function render() {
    const item = items[index]
    if (!item) return showDone()
    $('done').style.display = 'none'
    $('stage').style.display = 'inline-block'
    $('progress').textContent = `${index + 1} / ${items.length}`
    $('name').textContent = `${item.name} · ${item.group} · ${item.pose === 1 ? 'pose 1' : 'pose 2'}`
    $('guidance').innerHTML = GUIDANCE[item.kind]
    $('jump').max = items.length
    $('jump').value = index + 1
    current = pointFor(item)
    const img = $('img')
    img.onload = () => { applySize(); placeMarkers(); updateReadout() }
    img.src = '/img?f=' + encodeURIComponent(item.file)
    if (img.complete && img.naturalWidth) { applySize(); placeMarkers(); updateReadout() }
    updateReadout()
    updateCounts()
    $('undo').disabled = index === 0
    $('next').disabled = !current
  }

  function showDone() {
    $('stage').style.display = 'none'
    $('done').style.display = 'block'
    let set = 0
    for (const item of items) if (isSet(item)) set += 1
    $('doneSummary').textContent = `${set} of ${items.length} poses have anchors.`
    $('progress').textContent = `${items.length} / ${items.length}`
    updateCounts()
    $('undo').disabled = false
    $('next').disabled = true
  }

  function goTo(i) {
    index = Math.max(0, Math.min(items.length, i))
    render()
  }
  function next() {
    if (!current) return
    save()
    goTo(index + 1)
  }
  function undo() { goTo(index - 1) }
  function skip() {
    if (window.confirm('Skip this pose without setting an anchor?')) goTo(index + 1)
  }

  let saveTimer = null
  function save() {
    clearTimeout(saveTimer)
    saveTimer = setTimeout(async () => {
      await fetch('/save', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(manual)
      })
      updateCounts()
    }, 120)
  }
  window.addEventListener('beforeunload', () => {
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/save', JSON.stringify(manual))
    }
  })

  $('img').addEventListener('click', (e) => {
    const item = items[index]
    if (!item) return
    const rect = $('img').getBoundingClientRect()
    const nx = clamp01((e.clientX - rect.left) / rect.width)
    const ny = clamp01((e.clientY - rect.top) / rect.height)
    current = [Number(nx.toFixed(4)), Number(ny.toFixed(4))]
    setPoint(item, current)
    placeMarkers()
    updateReadout()
    save()
    $('next').disabled = false
  })

  $('jump').addEventListener('change', (e) => {
    const n = Number(e.target.value)
    if (Number.isFinite(n)) goTo(n - 1)
  })

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return
    if (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next() }
    else if (e.key === 'Backspace' || e.key === 'ArrowLeft') { e.preventDefault(); undo() }
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); skip() }
    else if (e.key === 'c' || e.key === 'C') { e.preventDefault(); clearPoint() }
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); setZoom(zoom * 1.5) }
    else if (e.key === '-') { e.preventDefault(); setZoom(zoom / 1.5) }
    else if (e.key === '0') { e.preventDefault(); setZoom(1) }
  })

  function setZoom(z) {
    zoom = Math.min(8, Math.max(0.25, z))
    applySize()
    placeMarkers()
  }

  ;(async () => {
    const res = await fetch('/items')
    const data = await res.json()
    items = data.items
    shipped = data.shipped ?? {}
    const stateRes = await fetch('/state')
    manual = await stateRes.json()
    const qs = new URLSearchParams(location.search)
    if (qs.has('i')) {
      index = Math.max(0, Math.min(items.length - 1, Number(qs.get('i'))))
    } else {
      const first = items.findIndex((it) => !isSet(it))
      index = first >= 0 ? first : 0
    }
    render()
  })()
</script>
</body>
</html>
