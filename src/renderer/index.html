<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ows-asset: ows-library:; media-src 'self' data: blob: ows-asset: ows-library:; connect-src 'self' ows-asset: ows-library: ws://localhost:* http://localhost:*; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Boot assets live in public/ so the dev server can serve them too: the
         splash paints before the bundle exists, and a path outside the renderer
         root resolves to a 404 in dev (broken image on the splash). Keep this
         copy in sync with src/assets/openscribe-128.png. -->
    <link rel="icon" type="image/png" href="/openscribe-128.png" />
    <title>Openscribe</title>
    <style>
      /* Boot splash. Painted by the document itself so the window has something
         to show before the bundle has parsed, mounted, and read the project
         store. React removes it once the first frame is on screen. */
      html,
      body {
        margin: 0;
        background: #08080a;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 9000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(1100px 700px at 50% 42%, #131118 0%, #0a0a0c 52%, #060607 100%);
        color: #f1f1f2;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        transition: opacity 320ms ease, visibility 320ms ease;
      }

      /* A faint measured grid and a vignette give the dark field depth without
         competing with the brand lockup. */
      #boot::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px);
        background-size: 28px 28px;
        -webkit-mask-image: radial-gradient(ellipse at 50% 46%, rgba(0, 0, 0, 0.85), transparent 68%);
        mask-image: radial-gradient(ellipse at 50% 46%, rgba(0, 0, 0, 0.85), transparent 68%);
        opacity: 0.55;
        pointer-events: none;
      }

      #boot::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 48%, transparent 30%, rgba(0, 0, 0, 0.62) 100%);
        pointer-events: none;
      }

      /* Slow aurora field. Soft colour bodies drift independently behind the
         splash while a light beam crosses the frame, so the opening feels
         alive rather than like a static card. */
      .boot-ambient {
        position: absolute;
        inset: -18%;
        pointer-events: none;
        overflow: hidden;
      }

      .boot-orb {
        position: absolute;
        display: block;
        border-radius: 50%;
        filter: blur(64px);
        will-change: transform;
        transform: translate3d(0, 0, 0);
      }

      .boot-orb-a {
        top: -6%;
        left: -10%;
        width: clamp(420px, 58vw, 900px);
        height: clamp(420px, 58vw, 900px);
        background: radial-gradient(circle, rgba(255, 63, 208, 0.44), rgba(255, 63, 208, 0) 66%);
        animation: boot-drift-a 22s ease-in-out infinite alternate;
      }

      .boot-orb-b {
        top: 14%;
        right: -16%;
        width: clamp(380px, 52vw, 820px);
        height: clamp(380px, 52vw, 820px);
        background: radial-gradient(circle, rgba(116, 92, 255, 0.36), rgba(116, 92, 255, 0) 68%);
        animation: boot-drift-b 28s ease-in-out infinite alternate;
      }

      .boot-orb-c {
        bottom: -26%;
        left: 20%;
        width: clamp(340px, 46vw, 720px);
        height: clamp(340px, 46vw, 720px);
        background: radial-gradient(circle, rgba(53, 208, 240, 0.22), rgba(53, 208, 240, 0) 70%);
        animation: boot-drift-c 25s ease-in-out infinite alternate;
      }

      .boot-beam {
        position: absolute;
        top: -45%;
        left: -18%;
        display: block;
        width: 22%;
        height: 190%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.05) 42%,
          rgba(255, 140, 230, 0.09) 50%,
          rgba(255, 255, 255, 0.05) 58%,
          transparent
        );
        filter: blur(14px);
        transform: rotate(16deg);
        animation: boot-beam 9s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        will-change: transform, opacity;
      }

      body.booted #boot {
        opacity: 0;
        visibility: hidden;
      }

      .boot-card {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: boot-rise 560ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      .boot-logo-wrap {
        position: relative;
        display: grid;
        place-items: center;
      }

      .boot-logo-wrap::before {
        content: "";
        position: absolute;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 63, 208, 0.22), transparent 68%);
        filter: blur(12px);
      }

      .boot-logo {
        position: relative;
        width: 62px;
        height: 62px;
        border-radius: 15px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.14),
          0 18px 44px rgba(0, 0, 0, 0.58),
          0 0 34px rgba(255, 63, 208, 0.16);
      }

      .boot-brand {
        margin-top: 18px;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.45px;
      }

      .boot-sub {
        margin-top: 4px;
        font-size: 9.5px;
        font-weight: 550;
        letter-spacing: 1.7px;
        text-transform: uppercase;
        color: #77777f;
      }

      /* A real, indeterminate progress bar: a rounded track with a gradient
         sweep that keeps moving while the app is genuinely loading. */
      .boot-track {
        position: relative;
        width: 216px;
        height: 3px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .boot-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255, 63, 208, 0.2), #ff3fd0 55%, #ff9ae6);
        box-shadow: 0 0 12px rgba(255, 63, 208, 0.45);
        animation: boot-sweep 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .boot-stage {
        min-height: 16px;
        margin-top: 13px;
        font-size: 10.5px;
        letter-spacing: 0.2px;
        color: #85858d;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @keyframes boot-drift-a {
        0% {
          transform: translate3d(-4%, -3%, 0) scale(1);
        }
        50% {
          transform: translate3d(7%, 6%, 0) scale(1.08);
        }
        100% {
          transform: translate3d(-2%, 10%, 0) scale(0.98);
        }
      }

      @keyframes boot-drift-b {
        0% {
          transform: translate3d(5%, -4%, 0) scale(1.04);
        }
        50% {
          transform: translate3d(-8%, 8%, 0) scale(0.96);
        }
        100% {
          transform: translate3d(2%, 14%, 0) scale(1.1);
        }
      }

      @keyframes boot-drift-c {
        0% {
          transform: translate3d(-6%, 4%, 0) scale(0.96);
        }
        50% {
          transform: translate3d(9%, -6%, 0) scale(1.06);
        }
        100% {
          transform: translate3d(-3%, -10%, 0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-card {
          animation: none;
        }

        .boot-bar {
          animation: none;
          transform: translateX(0);
        }

        .boot-orb {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-ambient" aria-hidden="true">
        <span class="boot-orb boot-orb-a"></span>
        <span class="boot-orb boot-orb-b"></span>
        <span class="boot-orb boot-orb-c"></span>
      </div>
      <div class="boot-card">
        <div class="boot-logo-wrap">
          <img class="boot-logo" src="/openscribe-128.png" alt="" />
        </div>
        <div class="boot-brand">Openscribe</div>
        <div class="boot-sub">Whiteboard animation studio</div>
        <div class="boot-track" aria-hidden="true">
          <div class="boot-bar"></div>
        </div>
        <div class="boot-stage" id="boot-stage">Preparing your workspace</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
